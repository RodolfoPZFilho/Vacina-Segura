# =============================================================
# VacinaSegura - configuração do broker Mosquitto do projeto
# Uso: mosquitto -c infra\mosquitto.conf -v
# =============================================================

# Broker local do projeto (porta 1884, para não conflitar com o
# serviço padrão do Mosquitto no Windows, que ocupa a 1883).
listener 1884
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# -------------------------------------------------------------
# Ponte (bridge) com o broker público usado pelo Wokwi.
# O ESP32 simulado no Wokwi não alcança a rede local, então ele
# publica em broker.hivemq.com e o Mosquitto local traz essas
# mensagens para cá. Fluxo:
#   ESP32 (Wokwi) -> MQTT -> broker.hivemq.com -> ponte -> Mosquitto local -> Python
#
# Remoto: vacinasegura/35kr1sud/ubs/<ubs>/geladeira/<geladeira>
# Local : vacinasegura/ubs/<ubs>/geladeira/<geladeira>
# -------------------------------------------------------------
connection ponte-wokwi
address broker.hivemq.com:1883
clientid vacinasegura-ponte-35kr1sud
bridge_protocol_version mqttv311
try_private false
cleansession true
notifications false
restart_timeout 5 30
topic ubs/# in 0 vacinasegura/ vacinasegura/35kr1sud/
