# Configuracao do Wokwi para VS Code (extensao Wokwi Simulator)
# 1) Compile com: powershell -ExecutionPolicy Bypass -File compilar-firmware.ps1
# 2) No VS Code, com esta pasta aberta: F1 > "Wokwi: Start Simulator"
[wokwi]
version = 1
firmware = 'build/sketch.ino.merged.bin'
elf = 'build/sketch.ino.elf'