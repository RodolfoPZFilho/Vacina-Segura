name: Docker Compose (integracao)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicos/requirements.txt
      - run: pip install -r servicos/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: servicos

  sobe-tudo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Gera os segredos (.env)
        run: sh gerar-segredos.sh > /dev/null

      - name: docker compose up (um unico comando)
        run: docker compose up -d --build

      - name: Testa os tres fluxos (IoT->Web, Web->IoT, IA) e o assistente
        run: python3 .github/scripts/teste_integracao.py

      - name: Estado dos servicos
        if: always()
        run: docker compose ps -a

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Desliga
        if: always()
        run: docker compose down -v
